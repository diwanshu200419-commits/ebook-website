<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Upload Content | E-Book Market</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="upload.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="../auth.js"></script>
</head>
<body>

<div class="upload-wrapper">

  <div class="upload-card">

    <header class="upload-header">
      <h1>Upload New Content</h1>
      <p class="sub">
        Publish knowledge • Earn globally • AI-powered quality review
      </p>
    </header>

    <form id="uploadForm" autocomplete="off">

      <!-- ================= TITLE ================= -->
      <label for="title">Content Title *</label>
      <input type="text" id="title" required minlength="5"
        placeholder="Advanced Java Handwritten Notes for BCA" />

      <!-- ================= TYPE ================= -->
      <label for="type">Content Type *</label>
      <select id="type" required>
        <option value="">Select Type</option>
        <option value="Book">📘 E-Book</option>
        <option value="Notes">📝 Handwritten Notes</option>
        <option value="Comics">💬 Comics</option>
        <option value="AI">🤖 AI-Assisted Content</option>
      </select>

      <!-- ================= CATEGORY ================= -->
      <label for="category">Category *</label>
      <select id="category" required>
        <option value="">Select Category</option>
        <option value="Education">Education</option>
        <option value="Technology">Technology</option>
        <option value="Self Help">Self Help</option>
        <option value="Fiction">Fiction</option>
        <option value="Competitive">Competitive Exams</option>
        <option value="Other">Other</option>
      </select>

      <!-- ================= LANGUAGE ================= -->
      <label for="language">Language</label>
      <select id="language">
        <option value="English">English</option>
        <option value="Hindi">Hindi</option>
        <option value="Hinglish">Hinglish</option>
      </select>

      <!-- ================= TAGS ================= -->
      <label>Tags (Max 5)</label>
      <div class="tag-input" id="tagContainer">
        <input type="text" id="tagInput"
          placeholder="Press Enter to add tag"/>
      </div>

      <!-- ================= PRICE ================= -->
      <label for="price">Price (₹)</label>
      <input type="number" id="price" min="0" placeholder="0 = Free" />

      <div class="earning-box">
        <p>You earn:</p>
        <strong>₹<span id="earnPreview">0</span></strong>
        <small>(81% creator share)</small>
      </div>

      <!-- ================= THUMBNAIL ================= -->
      <label>Thumbnail (Recommended 800x600)</label>
      <div class="thumbnail-upload">
        <input type="file" id="thumbnail" accept="image/*" hidden />
        <div class="thumbnail-box" id="thumbnailBox">
          <span>Click to Upload Thumbnail</span>
        </div>
      </div>

      <!-- ================= FILE UPLOAD ================= -->
      <label>Upload PDF *</label>
      <div class="drop-zone" id="dropZone">
        <p>Drag & Drop PDF here</p>
        <small>or click to browse (Max 50MB)</small>
        <input type="file" id="file" accept=".pdf" hidden />
      </div>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <!-- ================= DESCRIPTION ================= -->
      <label for="description">Description (Max 300)</label>
      <textarea id="description" maxlength="300"
        placeholder="Explain what users will learn..."></textarea>
      <small id="descCount">0 / 300</small>

      <!-- ================= COPYRIGHT ================= -->
      <label class="checkbox">
        <input type="checkbox" id="copyright" required />
        I confirm this content is original.
      </label>

      <!-- ================= AI PREVIEW ================= -->
      <div class="ai-review-box">
        <h4>AI Quality Score</h4>
        <div class="ai-score" id="aiScore">--</div>
      </div>

      <!-- ================= STATUS MESSAGE ================= -->
      <div class="status-message" id="statusMessage"></div>

      <!-- ================= BUTTONS ================= -->
      <div class="btn-row">
        <button type="button" class="btn secondary" onclick="saveDraft()">
          Save Draft
        </button>
        <button type="button" class="btn primary" onclick="uploadContent()">
          Submit for Review
        </button>
      </div>

    </form>

    <a class="back" href="dashboard.html">← Back to Dashboard</a>

  </div>

</div>

<script src="../auth.js"></script>
<script src="upload.js"></script>

</body>
</html>
