<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book Preview | E-Book Market</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #0b1020, #000);
      color: #fff;
      min-height: 100vh;
    }

    .nav {
      padding: 22px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 800;
      font-size: 22px;
      color: #6aa6ff;
    }

    .nav a {
      color: #ccc;
      text-decoration: none;
      margin-left: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 40px;
      padding: 0 40px;
    }

    .info {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border-radius: 22px;
      padding: 30px;
    }

    .info h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .meta {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .price {
      font-size: 22px;
      font-weight: 700;
      color: #10b981;
      margin-bottom: 20px;
    }

    .desc {
      font-size: 14px;
      line-height: 1.6;
      color: #ccc;
      margin-bottom: 30px;
    }

    .actions button {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .buy {
      background: linear-gradient(135deg, #6a5cff, #8b5cf6);
      color: #fff;
    }

    .login {
      background: transparent;
      border: 1px solid #6a5cff;
      color: #6a5cff;
    }

    .viewer {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border-radius: 22px;
      padding: 16px;
      height: 75vh;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 16px;
      background: #fff;
    }

    .note {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-top: 20px;
      padding-bottom: 30px;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }

      .viewer {
        height: 60vh;
      }
    }
  </style>
</head>

<body>
<header class="nav">
  <div class="logo">E-BOOK MARKET</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<main class="container">
  <aside class="info">
    <h1 id="bookTitle">Loading book...</h1>
    <p class="meta" id="bookMeta">Fetching details</p>
    <p class="price" id="bookPrice">FREE PREVIEW</p>
    <p class="desc" id="bookDescription">
      Please wait while the book preview is loading.
    </p>

    <div class="actions">
      <button class="buy" id="downloadBtn">Download Book</button>
      <button class="login" id="secondaryBtn">Sign In</button>
    </div>
  </aside>

  <section class="viewer">
    <iframe
      id="bookPreview"
      src="assets/books/I-Tried-8-Different-AI-Side-Hustles-for-Students-Heres-Which-Ones-Actually-Pay.pdf"
    ></iframe>
  </section>
</main>

<p class="note" id="bookNote">
  Preview only. Download access depends on the book's pricing and approval status.
</p>

<script src="auth.js"></script>
<script src="book-view.js"></script>
</body>
</html>
