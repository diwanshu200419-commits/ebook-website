<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book Preview | E-Book Market</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Inter",sans-serif;}

    body{
      background: radial-gradient(circle at top, #0b1020, #000);
      color:#fff;
    }

    .nav{
      padding:20px 50px;
      display:flex;
      justify-content:space-between;
    }

    .logo{font-weight:800;color:#6aa6ff;}

    .container{
      max-width:1200px;
      margin:40px auto;
      display:grid;
      grid-template-columns:1fr 2fr;
      gap:40px;
      padding:0 30px;
    }

    .info{
      background:rgba(255,255,255,0.05);
      padding:25px;
      border-radius:20px;
    }

    .price{color:#10b981;margin:15px 0;font-weight:700;}

    .actions button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:25px;
      margin-top:10px;
      cursor:pointer;
    }

    .buy{background:#6a5cff;color:#fff;}
    .login{background:transparent;border:1px solid #6a5cff;color:#6a5cff;}

    .viewer{
      background:#111;
      padding:10px;
      border-radius:20px;
      height:75vh;
    }

    iframe{
      width:100%;
      height:100%;
      border:none;
      border-radius:15px;
      background:#fff;
    }

    #paymentBox{
      display:none;
      margin-top:20px;
      text-align:center;
    }

    #paymentBox img{
      width:180px;
      margin:10px 0;
      border-radius:10px;
    }
  </style>
</head>

<body>

<header class="nav">
  <div class="logo">E-BOOK MARKET</div>
  <nav id="mainNav"></nav>
</header>

<main class="container">

  <!-- LEFT -->
  <aside class="info">

    <h1 id="bookTitle">Loading...</h1>
    <p id="bookMeta"></p>
    <p class="price" id="bookPrice"></p>
    <p id="bookDescription"></p>

    <div class="actions">
      <button class="buy" id="downloadBtn">Download / Buy</button>
      <button class="login" id="secondaryBtn">Sign In</button>
    </div>

    <!-- PAYMENT -->
    <div id="paymentBox">

      <h3>Scan & Pay</h3>

      <img src="assets/payment/gpay-qr.png" />
      <p>UPI: yourname@upi</p>

      <hr style="margin:15px 0;">

      <img src="assets/payment/paypal-qr.png" />

      <input type="file" id="screenshot" />

      <button onclick="submitPayment()">Submit Payment</button>

    </div>

  </aside>

  <!-- RIGHT -->
  <section class="viewer">
    <iframe id="bookPreview"></iframe>
  </section>

</main>

<p id="bookNote" style="text-align:center;margin-top:20px;"></p>

<script src="auth.js"></script>
<script src="script.js"></script>
<script src="book-view.js"></script>

</body>
</html>
