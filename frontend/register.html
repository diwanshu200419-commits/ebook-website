<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | E-Book Market</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<script src="config.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0b0f19;
  color:#fff;
}

/* Subtle background glow */
body::before{
  content:"";
  position:absolute;
  width:600px;
  height:600px;
  background:radial-gradient(circle,#8b5cf6,transparent 70%);
  top:-200px;
  right:-200px;
  opacity:0.15;
  filter:blur(120px);
}

/* Card */
.card{
  width:420px;
  max-width:95%;
  padding:40px;
  background:#111827;
  border-radius:20px;
  box-shadow:0 40px 80px rgba(0,0,0,0.6);
  border:1px solid rgba(255,255,255,0.05);
}

.card h1{
  font-size:26px;
  font-weight:800;
  margin-bottom:8px;
}

.sub{
  font-size:14px;
  color:#9ca3af;
  margin-bottom:25px;
}

/* Message */
.message{
  font-size:14px;
  margin-bottom:12px;
  min-height:18px;
}
.success{color:#22c55e;}
.error{color:#ef4444;}

/* Inputs */
.input{
  position:relative;
  margin-bottom:18px;
}

.input input{
  width:100%;
  padding:13px 14px 13px 42px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.08);
  background:#0f172a;
  color:#fff;
  outline:none;
  transition:0.2s;
}

.input input:focus{
  border-color:#8b5cf6;
  box-shadow:0 0 0 2px rgba(139,92,246,0.2);
}

.input i{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#6b7280;
}

/* Strength bar */
.strength-bar{
  height:4px;
  border-radius:4px;
  background:#1f2937;
  margin-top:6px;
  overflow:hidden;
}

.strength-fill{
  height:100%;
  width:0%;
  transition:0.3s;
}

/* Role select */
select{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.08);
  background:#0f172a;
  color:#fff;
  outline:none;
  margin-bottom:15px;
  transition:0.2s;
}

select:focus{
  border-color:#8b5cf6;
  box-shadow:0 0 0 2px rgba(139,92,246,0.2);
}

/* Checkbox */
.checkbox{
  font-size:13px;
  color:#9ca3af;
  margin-bottom:15px;
}

/* Button */
.btn{
  width:100%;
  padding:13px;
  border:none;
  border-radius:14px;
  background:#8b5cf6;
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}

.btn:hover{
  background:#7c3aed;
  transform:translateY(-2px);
}

/* Google */
.google{
  margin-top:12px;
  background:#fff;
  color:#111;
}

.google:hover{
  background:#e5e7eb;
}

.switch{
  margin-top:18px;
  text-align:center;
  font-size:13px;
  color:#9ca3af;
}

.switch a{
  color:#8b5cf6;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="card">

<h1>Create your account</h1>
<p class="sub">Start earning from knowledge 🌍</p>

<div class="message" id="messageBox"></div>

<div class="input">
<i class="fa fa-user"></i>
<input type="text" id="name" placeholder="Full name">
</div>

<div class="input">
<i class="fa fa-envelope"></i>
<input type="email" id="email" placeholder="Email address">
</div>

<div class="input">
<i class="fa fa-lock"></i>
<input type="password" id="password" placeholder="Password">
<div class="strength-bar">
<div class="strength-fill" id="strengthFill"></div>
</div>
</div>

<div class="input">
<i class="fa fa-lock"></i>
<input type="password" id="confirmPassword" placeholder="Confirm password">
</div>

<select id="role">
<option value="">Choose your role</option>
<option value="reader">📘 Reader</option>
<option value="creator">📝 Creator</option>
<option value="author">✍️ Author</option>
</select>

<div class="checkbox">
<input type="checkbox" id="terms"> I agree to Terms & Privacy Policy
</div>

<button class="btn" onclick="registerUser()" id="registerBtn">
Create Account
</button>

<button class="btn google" onclick="googleLogin()">
<i class="fab fa-google"></i> Continue with Google
</button>

<p class="switch">
Already have an account? <a href="login.html">Sign in</a>
</p>

</div>

<script>
const API_BASE = window.API_BASE || "https://ebook-website-v2mj.onrender.com";

/* Strength Logic */
const pass=document.getElementById("password");
const strengthFill=document.getElementById("strengthFill");

pass.addEventListener("input",()=>{
let val=pass.value;
let score=0;

if(val.length>=6) score+=30;
if(/[A-Z]/.test(val)) score+=30;
if(/[0-9]/.test(val)) score+=40;

strengthFill.style.width=score+"%";
strengthFill.style.background=
score<40?"#ef4444":
score<70?"#f59e0b":
"#22c55e";
});

/* Register */
async function registerUser(){
const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const password=pass.value.trim();
const confirm=document.getElementById("confirmPassword").value.trim();
const role=document.getElementById("role").value;
const terms=document.getElementById("terms").checked;

const btn=document.getElementById("registerBtn");
const message=document.getElementById("messageBox");

message.innerHTML="";

if(!name||!email||!password||!confirm||!role){
message.innerHTML="<span class='error'>Please fill all fields</span>";
return;
}

if(password!==confirm){
message.innerHTML="<span class='error'>Passwords do not match</span>";
return;
}

if(!terms){
message.innerHTML="<span class='error'>Accept terms</span>";
return;
}

btn.disabled=true;
btn.innerText="Creating...";

try{
const res=await fetch(`${API_BASE}/api/auth/register`,{
method:"POST",
credentials:"include",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({name,email,password,role})
});

const data=await res.json();

if(!res.ok){
message.innerHTML=`<span class='error'>${data.message||data.msg||"Registration failed"}</span>`;
return;
}

message.innerHTML="<span class='success'>Account created! Redirecting to login...</span>";
setTimeout(()=>window.location.href="login.html",1500);

}catch(err){
message.innerHTML="<span class='error'>Server error</span>";
}
finally{
btn.disabled=false;
btn.innerText="Create Account";
}
}

function googleLogin(){
window.location.href=`${API_BASE}/api/auth/google?returnTo=${encodeURIComponent(new URL("login.html",window.location.href).href)}`;
}
</script>

</body>
</html>
