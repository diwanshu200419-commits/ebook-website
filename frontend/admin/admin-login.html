<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | E-Book Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../auth.css">
  <script src="../config.js"></script>
  <style>
    body {
      background: radial-gradient(circle at top, #0b1020, #000);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-family: 'Inter', sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(106, 92, 255, 0.18), transparent 45%),
        radial-gradient(circle at 85% 25%, rgba(139, 92, 246, 0.16), transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.14), transparent 45%);
      z-index: -1;
      pointer-events: none;
    }
    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 60px rgba(139, 92, 246, 0.3);
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #6aa6ff, #8b5cf6);
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }
    .login-header p {
      color: #9ca3af;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #e5e7eb;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: none;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      background: linear-gradient(135deg, #6a5cff, #8b5cf6);
      color: #fff;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.45);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 55px rgba(139, 92, 246, 0.7);
    }
    .status {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      color: #9ca3af;
    }
    .status.error {
      color: #ef4444;
    }
    .status.success {
      color: #22c55e;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #6aa6ff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-header">
      <h1>Admin Login</h1>
      <p>Secure access only</p>
    </div>
    <form id="adminLoginForm">
      <div class="form-group">
        <label for="email">Admin Email</label>
        <input type="email" id="email" placeholder="Enter admin email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter admin password" required />
      </div>
      <button type="submit" class="btn">Login as Admin</button>
      <div id="status" class="status"></div>
    </form>
    <a href="../index.html" class="back-link">← Back to Home</a>
  </div>

  <script>
    const API_BASE = window.API_BASE || "";
    const form = document.getElementById("adminLoginForm");
    const statusEl = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      statusEl.textContent = "Logging in...";
      statusEl.className = "status";

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          statusEl.textContent = data.message || "Login failed";
          statusEl.className = "status error";
          return;
        }

        if (data.user?.role !== "admin") {
          statusEl.textContent = "Not authorized as admin";
          statusEl.className = "status error";
          return;
        }

        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));
        statusEl.textContent = "Login successful! Redirecting...";
        statusEl.className = "status success";
        setTimeout(() => {
          window.location.href = "admin.html";
        }, 1000);
      } catch (err) {
        statusEl.textContent = "Network error. Try again.";
        statusEl.className = "status error";
      }
    });
  </script>
</body>
</html>
